[settings]
npm.package_manager = "pnpm"

[bootstrap.dnf.repos]
ghostty = { copr = "scottames/ghostty" }

[bootstrap.packages]
"dnf:ghostty" = "latest"
"dnf:fish" = "latest"
"dnf:btop" = "latest"
"dnf:fastfetch" = "latest"
"dnf:neovim" = "latest"
"dnf:helix" = "latest"
"dnf:chezmoi" = "latest"
"dnf:gh" = "latest"
"dnf:just" = "latest"
"dnf:direnv" = "latest"
"dnf:llvm" = "latest"
"dnf:clang" = "latest"
"dnf:cmake" = "latest"
"dnf:cloc" = "latest"

"flatpak:com.brave.Browser" = "latest"
"flatpak:com.spotify.Client" = "latest"
"flatpak:org.videolan.VLC" = "latest"
"flatpak:com.discordapp.Discord" = "latest"
"flatpak:de.haeckerfelix.Fragments" = "latest"
"flatpak:md.obsidian.Obsidian" = "latest"
"flatpak:com.anydesk.Anydesk" = "latest"
"flatpak:com.getpostman.Postman" = "latest"
"flatpak:io.dbeaver.DBeaverCommunity" = "latest"
"flatpak:com.bitwarden.desktop" = "latest"

"brew:zellij" = "latest"
"brew:gopls" = "latest"
"brew:rust-analyzer" = "latest"
"brew:duf" = "latest"
"brew:yazi" = "latest"

[tools]
go = "latest"
rust = "stable"
node = "lts"
usage = "latest"
zig = "latest"
zls = "latest"

"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/junegunn/fzf" = "latest"
"go:github.com/gohugoio/hugo" = "latest"
"go:github.com/jesseduffield/lazygit" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/goreleaser/goreleaser/v2" = "latest"
"go:github.com/go-task/task/v3/cmd/task" = "latest"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "latest"

"cargo:fd-find" = "latest"
"cargo:ripgrep" = "latest"
"cargo:starship" = "latest"
"cargo:zoxide" = "latest"
"cargo:eza" = "latest"
"cargo:bat" = "latest"
"cargo:hyperfine" = "latest"

"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:@shopify/cli" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:@google/gemini-cli" = "latest"

[bootstrap.repos]
"~/Documents/ifdiego.github.io" = { url = "git@github.com:ifdiego/ifdiego.github.io.git" }
"~/Documents/obsidian-wiki" = { url = "git@github.com:ifdiego/obsidian-wiki.git" }
"~/Documents/protocol-sandbox" = { url = "git@github.com:ifdiego/protocol-sandbox.git" }
"~/Documents/adventofcode" = { url = "git@github.com:ifdiego/adventofcode.git" }
"~/Documents/wrangle" = { url = "git@github.com:ifdiego/wrangle.git" }
"~/Documents/home-manager" = { url = "git@github.com:ifdiego/home-manager.git" }

[tasks.bootstrap]
run = [
    "mise completion fish >~/.config/fish/completions/mise.fish",
]

[dotfiles]
"~/.config/git/config" = { source = "gitconfig", mode = "symlink" }
"~/.config/ghostty/config.ghostty" = { source = "ghostty.config", mode = "symlink" }
"~/.config/fish/config.fish" = { source = "config.fish", mode = "symlink" }
"~/.config/fish/fish_plugins" = { source = "fish_plugins", mode = "symlink" }
"~/.config/nvim/init.lua" = { source = "init.lua", mode = "symlink" }
"~/.config/nvim/nvim-pack-lock.json" = { source = "nvim-pack-lock.json", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "tmux.conf", mode = "symlink" }
"~/.config/starship.toml" = { source = "starship.toml", mode = "symlink" }
"~/.config/helix/config.toml" = { source = "config.toml", mode = "symlink" }
"~/.config/helix/languages.toml" = { source = "languages.toml", mode = "symlink" }
"~/.editorconfig" = { source = ".editorconfig", mode = "symlink" }
"~/.config/lazygit/config.yml" = { source = "lazygit.yml", mode = "symlink" }
"~/.config/zellij/config.kdl" = { source = "zellij.kdl", mode = "symlink" }
