theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
end-of-line-diagnostics = "hint"
bufferline = "multiple"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.soft-wrap]
enable = true

[keys.insert]
"j" = { "k" = "normal_mode" }
"k" = { "j" = "normal_mode" }

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

[editor.auto-save]
focus-lost = true
