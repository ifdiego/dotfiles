theme = "catppuccin_macchiato"

[editor]
line-number = "relative"
end-of-line-diagnostics = "hint"
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true

[editor.soft-wrap]
enable = true

[editor.auto-save]
focus-lost = true

[keys.insert]
"esc" = "normal_mode"
"C-c" = "normal_mode"

[keys.normal]
esc = [ "collapse_selection", "keep_primary_selection" ]
